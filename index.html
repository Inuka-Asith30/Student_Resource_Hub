<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Student Past Paper Management System</title>

  <!-- Google Font: Poppins (required font for the whole project) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Shared stylesheet used by every page -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ======================================================
       LOGIN PAGE
       This is the first page a student sees.
       It contains one centered card with the login form.
  ======================================================= -->
  <div class="login-page">

    <div class="login-card">

      <!-- University logo placeholder (a simple circle with initials) -->
      <div class="logo-placeholder">LOGO</div>

      <h1>Campus Portal</h1>
      <p class="subtitle">Student Past Paper Management System</p>

      <!-- 
        The form uses action="dashboard.html" so that clicking "Login"
        simply takes the user to the dashboard page.
        No real authentication happens here since this is a static
        front-end only project with no database.
      -->
      <form action="dashboard.html" method="get">

        <!-- Student email field -->
        <div class="form-group">
          <label for="email">Student Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="e.g. student@campus.edu"
            required
          />
        </div>

        <!-- Password field -->
        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
          />
        </div>

        <!-- Submitting the form redirects to the dashboard page -->
        <button type="submit" class="btn-primary">Login</button>
      </form>

      <p class="login-footer">© 2026 Campus Portal — For student use only</p>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
