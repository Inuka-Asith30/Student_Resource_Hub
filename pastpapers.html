<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Past Papers | Student Past Paper Management System</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />


  
</head>




<body>
<div class="app-layout">



     <aside class="sidebar">
      <div class="brand">
        <div class="logo-placeholder">LOGO</div>
        <span>Campus<br />Portal</span>
      </div>

      <nav>
        <ul>
          <li><a href="dashboard.html"> Dashboard</a></li>
          <li><a href="pastpapers.html" class="active"> Past Papers</a></li>
          <li><a href="upload.html">⬆ Upload Paper</a></li>
        </ul>
      </nav>

      <div class="logout">
        <a href="index.html"> Logout</a>
      </div>
    </aside>





    <main class="main-content">

      <div class="topbar">
        <h1>Past Papers</h1>
        <div class="user-chip">
          <div class="avatar">SM</div>
          <span>Sanduni Madushika</span>
        </div>
      </div>



   <div class="search-bar">
        <input
          type="text"
          id="searchInput"
          placeholder="Search by subject name (e.g. Physics, Maths...)"
        />
        <button id="searchBtn" type="button">Search</button>
      </div>



      <section class="papers-grid" id="papersGrid">

        <div class="paper-card" data-subject="physics">
          <div class="subject-icon">PH</div>
          <h3>Physics</h3>
          <p class="paper-year">Year: 2024</p>
          <button class="download-btn">⬇ Download</button>
        </div>


        

         <div class="paper-card" data-subject="mathematics">
          <div class="subject-icon">MA</div>
          <h3>Mathematics</h3>
          <p class="paper-year">Year: 2024</p>
          <button class="download-btn">⬇ Download</button>
        </div>


         <div class="paper-card" data-subject="chemistry">
          <div class="subject-icon">CH</div>
          <h3>Chemistry</h3>
          <p class="paper-year">Year: 2023</p>
          <button class="download-btn">⬇ Download</button>
        </div>


        <div class="paper-card" data-subject="computer science">
          <div class="subject-icon">CS</div>
          <h3>Computer Science</h3>
          <p class="paper-year">Year: 2023</p>
          <button class="download-btn">⬇ Download</button>
        </div>

        <div class="paper-card" data-subject="english">
          <div class="subject-icon">EN</div>
          <h3>English</h3>
          <p class="paper-year">Year: 2022</p>
          <button class="download-btn">⬇ Download</button>
        </div>

        <div class="paper-card" data-subject="statistics">
          <div class="subject-icon">ST</div>
          <h3>Statistics</h3>
          <p class="paper-year">Year: 2022</p>
          <button class="download-btn">⬇ Download</button>
        </div>







      </section>
    </main>





</div>

 <script src="script.js"></script>

  
</body>
</html>
